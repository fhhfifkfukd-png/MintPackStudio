
name: MintPack Android Debug APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: دریافت سورس
        uses: actions/checkout@v4

      - name: نصب Python و اجرای تست‌های سرویس
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: نصب وابستگی‌های تست
        run: pip install -r requirements-dev.txt

      - name: اجرای تست‌ها
        run: PYTHONPATH=. pytest -q service/tests

      - name: بررسی JavaScript
        run: node --check studio-web/app.js

      - name: نصب JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: نصب Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: نصب پلتفرم و Build Tools
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: نصب Gradle 9.5.0
        run: |
          curl -L --fail https://services.gradle.org/distributions/gradle-9.5.0-bin.zip -o /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /tmp
          echo "/tmp/gradle-9.5.0/bin" >> "$GITHUB_PATH"

      - name: ساخت Gradle Wrapper
        working-directory: android-template
        run: gradle wrapper --gradle-version 9.5.0 --distribution-type bin

      - name: ساخت APK آزمایشی
        working-directory: android-template
        run: ./gradlew --no-daemon :app:assembleDebug

      - name: بارگذاری APK و گزارش‌ها
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mintpack-debug-apk
          path: |
            android-template/app/build/outputs/apk/debug/app-debug.apk
            android-template/app/build/reports/**
          if-no-files-found: warn
          retention-days: 7
          
